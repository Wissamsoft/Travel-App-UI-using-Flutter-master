name: travel
description: Travel Booking Flutter Application.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # iOS style icons
  cupertino_icons: ^1.0.6

  # Google Fonts (Null Safety compatible)
  google_fonts: ^6.1.0

  # SVG support (Null Safety compatible)
  flutter_svg: ^2.0.9

  # Date and number formatting (Dart 3 compatible)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
